<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="Yummilicious">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9E0B18"/>
      <stop offset="55%" stop-color="#720711"/>
      <stop offset="100%" stop-color="#351A12"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F6B53A"/>
      <stop offset="100%" stop-color="#F28C00"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <circle cx="100" cy="100" r="96" fill="url(#bg)"/>
  <circle cx="100" cy="100" r="88" fill="none" stroke="url(#gold)" stroke-width="3"/>
  <circle cx="100" cy="100" r="78" fill="none" stroke="#FFF4DA" stroke-width="1.5" opacity="0.5"/>
  <!-- steam -->
  <path d="M70 58 C72 48, 78 48, 80 58 C82 68, 88 68, 90 58" fill="none" stroke="#F6B53A" stroke-width="2.5" stroke-linecap="round" opacity="0.9" filter="url(#glow)"/>
  <path d="M100 52 C102 42, 108 42, 110 52 C112 62, 118 62, 120 52" fill="none" stroke="#F28C00" stroke-width="2.5" stroke-linecap="round" opacity="0.85"/>
  <path d="M55 70 C57 62, 62 62, 64 70" fill="none" stroke="#FFF4DA" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
  <!-- plate -->
  <ellipse cx="100" cy="118" rx="48" ry="14" fill="#351A12" opacity="0.35"/>
  <ellipse cx="100" cy="112" rx="42" ry="28" fill="#FFF4DA"/>
  <ellipse cx="100" cy="110" rx="34" ry="20" fill="#F6B53A" opacity="0.35"/>
  <!-- food accent -->
  <ellipse cx="100" cy="108" rx="22" ry="12" fill="#9E0B18"/>
  <ellipse cx="100" cy="106" rx="16" ry="8" fill="#F28C00"/>
  <circle cx="92" cy="104" r="3" fill="#678E21"/>
  <circle cx="108" cy="106" r="2.5" fill="#678E21"/>
  <!-- wordmark arc -->
  <path id="arc" d="M38,100 A62,62 0 0,1 162,100" fill="none"/>
  <text fill="#F6B53A" font-family="Georgia, serif" font-size="16" font-weight="700" letter-spacing="1.5">
    <textPath href="#arc" startOffset="50%" text-anchor="middle">YUMMILICIOUS</textPath>
  </text>
  <text x="100" y="148" text-anchor="middle" fill="#FFF4DA" font-family="Georgia, serif" font-size="8" letter-spacing="2" opacity="0.9">HOMEMADE</text>
</svg>
